# Remote support signaling server - nginx TLS front-end
# Adapt: support.example.com -> your real DNS name.
# Place at /etc/nginx/sites-available/support-signaling and symlink into
# /etc/nginx/sites-enabled/, then run: certbot --nginx -d support.example.com

server {
    listen 80;
    listen [::]:80;
    server_name support.example.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name support.example.com;

    ssl_certificate     /etc/letsencrypt/live/support.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # WebSocket signaling endpoint
    location /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health check (keep internal in production if you prefer)
    location /healthz {
        proxy_pass http://127.0.0.1:8787/healthz;
    }

    location / {
        return 404;
    }
}
