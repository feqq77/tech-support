# coturn TURN/STUN server for remote support sessions
# Place at /etc/turnserver.conf (merge with the distribution defaults).
# Generate the static-auth-secret with:
#   python3 -c 'import secrets; print(secrets.token_urlsafe(32))'

listening-port=3478
tls-listening-port=5349
fingerprint

# Long-term credential mechanism; the secret only ever lives on this server.
use-auth-secret
static-auth-secret=PASTE-A-LONG-RANDOM-SECRET
realm=support.example.com

# Relay port range (open these UDP ports on the firewall)
min-port=49152
max-port=65535

# TLS certificate for the TLS TURN listener (can reuse the nginx certificate)
cert=/etc/letsencrypt/live/support.example.com/fullchain.pem
pkey=/etc/letsencrypt/live/support.example.com/privkey.pem

# Hardening
no-cli
no-tlsv1
no-tlsv1_1
no-multicast-peers
no-software-attribute
